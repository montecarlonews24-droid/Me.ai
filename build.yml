name: Build Me.ai APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack patch.pkg
        run: |
          if [ -f patch.pkg ]; then
            unzip -o patch.pkg -d .
            git rm -q patch.pkg
            git config user.name "Me.ai Builder"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "📦 Unpack patch.pkg"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle assembleDebug --no-daemon
          else
            echo "No sources yet — upload patch.pkg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MeAi-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
